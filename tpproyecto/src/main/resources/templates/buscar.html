<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda</title>
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.12/dist/turbo.es2017-umd.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{topbar :: topbar}"></div>

    
    <main class="contenido">
        <section class="seccion-musica">
            <h1>Resultados de búsqueda</h1>
    
            <p th:if="${query != null and !query.isEmpty()}">
                Resultados para:
                <strong th:text="${query}"></strong>
            </p>
    
            <p th:if="${query == null or query.isEmpty()}">
                Buscá una canción usando la barra superior.
            </p>
    
            <div class="lista-canciones" th:if="${resultados != null and !#lists.isEmpty(resultados)}">
            
                <article class="cancion" th:each="cancion : ${resultados}">
            
                    <div class="datos-cancion">
                        <h4 th:text="${cancion.nombre}">Nombre de la canción</h4>
            
                        <p th:text="${cancion.artista != null ? cancion.artista : 'Artista desconocido'}">
                            Artista
                        </p>
                    </div>
            
                    <div class="agregar-a-playlist" th:if="${playlists != null and !#lists.isEmpty(playlists)}">
            
                        <button type="button" class="boton-agregar-playlist" aria-label="Agregar a una playlist"
                            title="Agregar a una playlist">
                            +
                        </button>
            
                        <div class="opciones-playlist" hidden>
            
                            <form th:each="playlist : ${playlists}" th:action="@{api/playlists/agregar-cancion}" method="post" class="form-agregar-playlist">
            
                                <input type="hidden" name="playlistId" th:value="${playlist.id}">
            
                                <input type="hidden" name="cancionId" th:value="${cancion.id}">
            
                                <button type="submit" th:text="${playlist.nombre}">
                                    Nombre de playlist
                                </button>
            
                            </form>
            
                        </div>
                    </div>
            
                </article>
            </div>
    
            <p th:if="${resultados != null and #lists.isEmpty(resultados)}">
                No se encontraron resultados para esa búsqueda.
            </p>
    
        </section>
    
        <p class="mensaje-playlist" th:if="${mensaje}" th:text="${mensaje}"></p>
    
        <p class="mensaje-playlist" th:if="${error}" th:text="${error}"></p>

        <div th:replace="~{reproductor :: reproductor}"></div>
    </main>


    <script>
        document.addEventListener("click", function (event) {
            const boton = event.target.closest(".boton-agregar-playlist");

            document.querySelectorAll(".opciones-playlist").forEach(function (menu) {
                if (!boton || !boton.closest(".agregar-a-playlist").contains(menu)) {
                    menu.hidden = true;
                }
            });

            if (boton) {
                const menu = boton.nextElementSibling;
                menu.hidden = !menu.hidden;
                event.stopPropagation();
            }
        });
    </script>

    <!-- script para que no redirija despues de guardar una cancion en la playlist -->

    <script>
        document.addEventListener("submit", async function (event) {
            const formulario = event.target.closest(".form-agregar-playlist");

            if (!formulario) {
                return;
            }

            event.preventDefault();

            const boton = formulario.querySelector("button[type='submit']");
            const textoOriginal = boton.textContent;

            boton.disabled = true;
            boton.textContent = "Agregando...";

            try {
                const respuesta = await fetch(formulario.action, {
                    method: "POST",
                    body: new FormData(formulario)
                });

                const mensaje = await respuesta.text();

                if (!respuesta.ok) {
                    throw new Error(mensaje || "No se pudo agregar la canción.");
                }

                boton.textContent = "¡Agregada!";

                setTimeout(() => {
                    formulario.closest(".opciones-playlist").hidden = true;
                    boton.textContent = textoOriginal;
                    boton.disabled = false;
                }, 1000);

            } catch (error) {
                alert(error.message || "Ocurrió un error al agregar la canción.");
                boton.textContent = textoOriginal;
                boton.disabled = false;
            }
        });
    </script>


</body>
</html>
