<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Búsqueda</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Circular', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #FFFFFF;
            min-height: 100vh;
        }

        /* Top Bar estilo Spotify */
        .topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 64px;
    background-color: #000000;
    display: flex;
    align-items: center;
    padding: 0 24px;
    z-index: 1000;
}


        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1DB954; /* Verde Spotify */
        }

        /* Barra de búsqueda centrada con dropdown desplegable */
        .search-container {
            position: relative;
            width: 360px;
        }

        .search-container {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 480px; /* Tamaño ideal similar a Spotify */
}

        .search-input {
            width: 100%;
            height: 40px;
            border-radius: 500px;
            background-color: #242424;
            border: 1px solid transparent;
            padding: 0 16px 0 40px;
            color: #FFFFFF;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: #FFFFFF;
            background-color: #2A2A2A;
        }

        .search-input::placeholder {
            color: #B3B3B3;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            fill: #B3B3B3;
            pointer-events: none;
        }

        /* Dropdown Flotante para los Resultados */
        .results-dropdown {
            position: absolute;
            top: 48px;
            left: 0;
            width: 100%;
            background-color: #181818;
            border-radius: 8px;
            box-shadow: 0 16px 24px rgba(0, 0, 0, 0.5);
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #282828;
            z-index: 1001;
        }

        .result-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            gap: 12px;
            border-bottom: 1px solid #242424;
            transition: background-color 0.2s;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background-color: #282828;
        }

        .music-icon {
            width: 32px;
            height: 32px;
            background-color: #282828;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            fill: #B3B3B3;
            flex-shrink: 0;
        }

        .song-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .song-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 0.75rem;
            color: #B3B3B3;
        }

        .no-results {
            padding: 16px;
            font-size: 0.875rem;
            color: #B3B3B3;
            text-align: center;
        }

        /* Contenido Principal (Background) */
        .main-content {
            margin-top: 64px;
            padding: 40px;
        }

        .main-content h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .main-content p {
            color: #B3B3B3;
        }
    </style>
</head>
<body>

    <!-- Header Fijo Superior (Spotify Topbar) -->
    <header class="topbar">
        <div class="brand">
            🎵 <span>Spotify</span>
        </div>

        <!-- Buscador Flotante Central -->
        <div class="search-container">
    <form action="/buscar" method="get" class="search-form" id="searchForm">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24">
            <path d="M10.5 2a8.5 8.5 0 105.262 15.176l5.352 5.352a1 1 0 001.414-1.414l-5.352-5.352A8.5 8.5 0 0010.5 2zm-6.5 8.5a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/>
        </svg>
        <input type="text" id="searchInput" name="query" class="search-input" th:value="${query}" placeholder="¿Qué quieres escuchar?" autocomplete="off" />
        
        <!-- Botón 'X' para limpiar que aparece si hay texto -->
        <span th:if="${query != null and !query.isEmpty()}" onclick="window.location.href='/buscar'" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #B3B3B3; font-weight: bold;">✕</span>
    </form>

    <!-- Dropdown con resultados flotantes -->
    <div class="results-dropdown" th:if="${resultados != null}">
        <div th:if="${#lists.isEmpty(resultados)}" class="no-results">
            No se encontraron resultados para "<span th:text="${query}"></span>"
        </div>

        <div th:each="cancion : ${resultados}" class="result-item">
            <div class="music-icon">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
            </div>
            <div class="song-info">
                <span class="song-title" th:text="${cancion.nombre}">Título de Canción</span>
                <span class="song-artist" th:text="${cancion.artista != null ? cancion.artista : 'Artista Desconocido'}">Artista</span>
            </div>
        </div>
    </div>
</div>
