
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="topbar" class="barra-superior">

    <a class="marca" th:href="@{/}">Spotify</a>

    <nav class="navegacion-superior" aria-label="Navegación principal">
        <a class="enlace-navegacion" th:href="@{/}">Inicio</a>
        <a class="enlace-navegacion" th:href="@{/biblioteca}">Biblioteca</a>
    </nav>

    <div class="contenedor-buscador">
        <form id="searchForm" th:action="@{/buscar}" method="get"
              class="formulario-busqueda">

            <svg class="icono-busqueda" width="18" height="18"
                 viewBox="0 0 24 24" fill="#B3B3B3" aria-hidden="true">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5
                16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16
                9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5
                4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99
                5 9.5S7.01 5 9.5 5 14 7.01 14 9.5
                11.99 14 9.5 14z"/>
            </svg>

            <input type="text"
                   id="searchInput"
                   name="query"
                   th:value="${query}"
                   placeholder="¿Qué querés escuchar?"
                   autocomplete="off"
                   oninput="buscarEnTiempoReal()"
                   class="campo-busqueda"
                   aria-label="Buscar canciones">

            <button type="button"
                    id="clearBtn"
                    onclick="limpiarBuscador()"
                    class="boton-limpiar-busqueda"
                    aria-label="Limpiar búsqueda">✕</button>
        </form>

        <div id="resultsDropdown"
             class="resultados-busqueda">
        </div>
        <div id="menuPlaylistsGlobal" class="menu-playlists-global" hidden>
            <p>Agregar a playlist</p>
            <div id="opcionesPlaylistsGlobal"></div>
        </div>

    </div>

    
<script>
    (function () {
        // Registrar los eventos globales una sola vez.
        if (window.topbarEventosRegistrados) return;
        window.topbarEventosRegistrados = true;

        window.timeoutBusquedaId = window.timeoutBusquedaId || null;

        let playlistsGlobal = [];
        let cancionSeleccionadaId = null;

        // Cargar las playlists disponibles.
        async function cargarPlaylists() {
            try {
                const respuesta = await fetch('/api/playlists');

                if (!respuesta.ok) {
                    throw new Error('No se pudieron cargar las playlists');
                }

                playlistsGlobal = await respuesta.json();
            } catch (error) {
                console.error('Error al cargar playlists:', error);
                playlistsGlobal = [];
            }
        }

        cargarPlaylists();

        // Búsqueda de canciones.
        window.buscarEnTiempoReal = function () {
            const input = document.getElementById('searchInput');
            const dropdown = document.getElementById('resultsDropdown');
            const clearBtn = document.getElementById('clearBtn');

            if (!input || !dropdown) return;

            const query = input.value.trim();

            if (clearBtn) {
                clearBtn.style.display = query ? 'block' : 'none';
            }

            clearTimeout(window.timeoutBusquedaId);

            if (!query) {
                dropdown.style.display = 'none';
                dropdown.innerHTML = '';
                return;
            }

            window.timeoutBusquedaId = setTimeout(async () => {
                // Evitar usar elementos antiguos si Turbo navegó.
                const inputActual = document.getElementById('searchInput');
                const dropdownActual = document.getElementById('resultsDropdown');

                if (!inputActual || !dropdownActual) return;
                if (inputActual.value.trim() !== query) return;

                try {
                    const respuesta = await fetch(
                        '/api/canciones/buscar?query=' + encodeURIComponent(query)
                    );

                    if (!respuesta.ok) {
                        throw new Error('Error al buscar canciones');
                    }

                    const canciones = await respuesta.json();
                    dropdownActual.innerHTML = '';

                    if (canciones.length === 0) {
                        dropdownActual.innerHTML =
                            '<div style="padding:14px;color:#B3B3B3;font-size:0.85rem;">No se encontraron resultados</div>';
                    } else {
                        canciones.forEach(cancion => {
                            const item = document.createElement('div');
                            item.className = 'resultado-busqueda-item';
                            item.dataset.cancionId = cancion.id;
                            item.dataset.cancionNombre = cancion.nombre || '';
                            item.style.cssText =
                                'display:flex;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid #242424;';

                            const datos = document.createElement('div');
                            datos.style.cssText =
                                'display:flex;flex-direction:column;min-width:0;';

                            const nombre = document.createElement('span');
                            nombre.textContent = cancion.nombre || '';
                            nombre.style.cssText =
                                'color:#fff;font-size:0.9rem;font-weight:500;';

                            const artista = document.createElement('span');
                            artista.textContent = cancion.artista || '';
                            artista.style.cssText =
                                'color:#B3B3B3;font-size:0.75rem;';

                            datos.append(nombre, artista);
                            item.appendChild(datos);
                            dropdownActual.appendChild(item);
                        });
                    }

                    dropdownActual.style.display = 'block';
                } catch (error) {
                    console.error('Error al buscar canciones:', error);
                }
            }, 200);
        };

        // Limpiar búsqueda.
        window.limpiarBuscador = function () {
            const input = document.getElementById('searchInput');
            const dropdown = document.getElementById('resultsDropdown');
            const clearBtn = document.getElementById('clearBtn');

            if (input) {
                input.value = '';
                input.focus();
            }

            if (dropdown) {
                dropdown.style.display = 'none';
                dropdown.innerHTML = '';
            }

            if (clearBtn) clearBtn.style.display = 'none';

            clearTimeout(window.timeoutBusquedaId);
        };

        // Abrir el menú al hacer clic derecho en una sugerencia.
        document.addEventListener('contextmenu', async function (event) {
            const item = event.target.closest('.resultado-busqueda-item');
            const dropdown = document.getElementById('resultsDropdown');

            if (!item || !dropdown || !dropdown.contains(item)) return;

            event.preventDefault();

            const menu = document.getElementById('menuPlaylistsGlobal');
            const opciones = document.getElementById('opcionesPlaylistsGlobal');

            if (!menu || !opciones) {
                console.error('No se encontró el menú de playlists en el DOM.');
                return;
            }

            cancionSeleccionadaId = item.dataset.cancionId;
            opciones.innerHTML = '';

            // Si la carga inicial aún no terminó, intentarlo de nuevo.
            if (playlistsGlobal.length === 0) {
                await cargarPlaylists();
            }

            if (playlistsGlobal.length === 0) {
                const mensaje = document.createElement('p');
                mensaje.textContent = 'No hay playlists disponibles';
                opciones.appendChild(mensaje);
            } else {
                playlistsGlobal.forEach(playlist => {
                    const form = document.createElement('form');
                    form.method = 'post';
                    form.action = '/api/playlists/agregar-cancion';

                    const playlistId = document.createElement('input');
                    playlistId.type = 'hidden';
                    playlistId.name = 'playlistId';
                    playlistId.value = playlist.id;

                    const cancionId = document.createElement('input');
                    cancionId.type = 'hidden';
                    cancionId.name = 'cancionId';
                    cancionId.value = cancionSeleccionadaId;

                    const boton = document.createElement('button');
                    boton.type = 'submit';
                    boton.textContent = playlist.nombre;

                    form.append(playlistId, cancionId, boton);
                    opciones.appendChild(form);
                });
            }

            menu.hidden = false;
            menu.style.display = 'block';
            menu.style.position = 'fixed';
            menu.style.margin = '0';
            menu.style.transform = 'none';
            menu.style.zIndex = '99999';

            // Calcular la posición después de generar las opciones.
            const margen = 8;
            const separacion = 4;
            const ancho = menu.offsetWidth;
            const alto = menu.offsetHeight;

            let x = event.clientX + separacion;
            let y = event.clientY + separacion;

            if (x + ancho > window.innerWidth - margen) {
                x = event.clientX - ancho - separacion;
            }

            if (y + alto > window.innerHeight - margen) {
                y = event.clientY - alto - separacion;
            }

            menu.style.left = Math.max(margen, x) + 'px';
            menu.style.top = Math.max(margen, y) + 'px';
        });

        // Agregar canción a la playlist elegida.
        document.addEventListener('submit', async function (event) {
            const form = event.target;

            if (
                !(form instanceof HTMLFormElement) ||
                form.action !== new URL('/api/playlists/agregar-cancion', location.origin).href
            ) {
                return;
            }

            event.preventDefault();

            const menu = document.getElementById('menuPlaylistsGlobal');
            const boton = form.querySelector('button');

            if (boton) boton.disabled = true;

            try {
                const respuesta = await fetch(form.action, {
                    method: 'POST',
                    body: new URLSearchParams(new FormData(form))
                });

                const mensaje = await respuesta.text();

                if (!respuesta.ok) {
                    alert(mensaje || 'No se pudo agregar la canción.');
                    return;
                }

                if (menu) {
                    menu.hidden = true;
                    menu.style.display = 'none';
                }

                alert(mensaje);
            } catch (error) {
                console.error('Error al agregar la canción:', error);
                alert('No se pudo conectar con el servidor.');
            } finally {
                if (boton) boton.disabled = false;
            }
        });

        // Cerrar sugerencias y menú al hacer clic fuera.
        document.addEventListener('click', function (event) {
            const searchBox = document.getElementById('searchForm');
            const dropdown = document.getElementById('resultsDropdown');
            const menu = document.getElementById('menuPlaylistsGlobal');

            if (searchBox && !searchBox.contains(event.target) && dropdown) {
                dropdown.style.display = 'none';
            }

            if (menu && !event.target.closest('#menuPlaylistsGlobal')) {
                menu.hidden = true;
                menu.style.display = 'none';
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                const menu = document.getElementById('menuPlaylistsGlobal');

                if (menu) {
                    menu.hidden = true;
                    menu.style.display = 'none';
                }
            }
        });
    })();
</script>


</header>

</body>
</html>
