<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me gusta</title>
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.12/dist/turbo.es2017-umd.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{topbar :: topbar}"></div>

    <main class="contenido">
        <h2>♥ Me gusta</h2>
        <p>Tu colección de canciones favoritas.</p>

        <section class="seccion-musica">
            <p th:if="${#lists.isEmpty(canciones)}">
                Todavía no agregaste canciones a favoritos.
                Podés hacerlo desde el botón del corazón en la página principal.
            </p>

            <div class="lista-playlist" th:if="${!#lists.isEmpty(canciones)}">
                <article class="cancion" th:each="cancion : ${canciones}">
                    <div class="nombre-cancion">
                        <h4 th:text="${cancion.nombre}">Nombre de canción</h4>
                    </div>

                    <div class="nombre-artista">
                        <p th:text="${cancion.artista}">Artista</p>
                    </div>

                    <div class="acciones-cancion">
                        <button type="button" class="seleccionar-cancion" th:data-nombre="${cancion.nombre}"
                            th:data-artista="${cancion.artista}" th:data-audio="${cancion.rutaArchivo}">
                            ▶ 
                        </button>

                        <form th:action="@{/favoritos}" method="post">
                            <input type="hidden"
                                   name="cancionId"
                                   th:value="${cancion.id}">

                            <button type="submit"
                                    class="boton-favorito"
                                    title="Quitar de favoritos">
                                ♥
                            </button>
                        </form>
                    </div>
                </article>
            </div>
        </section>

        <div th:replace="~{reproductor :: reproductor}"></div>
    </main>


</body>
</html>
