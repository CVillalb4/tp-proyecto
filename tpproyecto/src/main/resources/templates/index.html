<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spotify Clone</title>
</head>
<body style="background-color: #000; color: #fff; margin: 0; font-family: sans-serif; display: flex;">

    <!-- 1. Menú Lateral Izquierdo -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- 2. Barra Superior (TopBar / Buscador) -->
    <div th:replace="~{fragments/topbar :: topbar}"></div>

    <!-- 3. Contenido Principal -->
    <main style="margin-left: 240px; margin-top: 60px; padding: 30px; width: calc(100% - 240px);">
        <h2>Bienvenido a tu música</h2>
        <p style="color: #B3B3B3;">Explorá tus playlists o buscá canciones en la barra superior.</p>
    </main>

    <!-- 4. Menú Contextual (Clic derecho) -->
    <div th:replace="~{fragments/context-menu :: contextMenu}"></div>

<script src="/js/app.js"></script>
</body>
</html>
