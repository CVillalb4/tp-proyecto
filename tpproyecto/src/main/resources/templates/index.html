
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{topbar :: topbar}"></div>
    

    <main class="contenido">
        <h2>Bienvenido a Spotify</h2>
        <p>Tu espacio para escuchar y organizar música.</p>


        <p th:if="${mensaje}" th:text="${mensaje}"></p>
        
        <p th:if="${error}" 
        th:text="${error}" 
        class="mensaje-error"></p>

        <section class="seccion-musica">
            <h3>Agregar una canción</h3>

            <p th:if="${mensaje}" th:text="${mensaje}"></p>

            <form th:action="@{/canciones}"
                th:object="${nuevaCancion}"
                method="post"
                enctype="multipart/form-data"
                class="formulario-cancion">

                <label for="nombre">Nombre de la canción</label>
                <input id="nombre"
                    type="text"
                    th:field="*{nombre}"
                    maxlength="150" required>

                <label for="artista">Artista</label>
                <input id="artista"
                    type="text"
                    th:field="*{artista}"
                    maxlength="150"
                    required>

                <label for="album">Álbum</label>
                <input id="album"
                    type="text"
                    th:field="*{album}"
                    maxlength="150">

                <label for="archivo">Archivo de audio MP3</label>
                <input id="archivo"
                 type="file" 
                 name="archivo" 
                 accept=".mp3,audio/mpeg" required>

                <label for="duracionSegundos">Duración en segundos</label>
                <input id="duracionSegundos"
                    type="number"
                    th:field="*{duracionSegundos}"
                    min="1">

                <button type="submit">Guardar canción</button>
            </form>
        </section>


        <section class="seccion-musica" id="biblioteca">
            <h3>Tu biblioteca musical</h3>
                
            <p th:if="${#lists.isEmpty(canciones)}">
                  Todavía no hay canciones cargadas.
            </p>
                
            <div class="lista-canciones" th:unless="${#lists.isEmpty(canciones)}">
                <article class="cancion" th:each="cancion : ${canciones}">
                    <div class="datos-cancion">
                        <h4 th:text="${cancion.nombre}">Nombre de la canción</h4>
                        <p th:text="${cancion.artista}">Artista</p>
                        <p th:if="${cancion.album != null and !cancion.album.isEmpty()}" th:text="${cancion.album}">Álbum</p>
                    </div>
                
                    <button type="button" class="seleccionar-cancion" th:data-nombre="${cancion.nombre}"
                         th:data-artista="${cancion.artista}" th:data-audio="${cancion.rutaArchivo}">
                         ▶ Reproducir
                    </button>

                    <form th:action="@{/favoritos}" method="post">
                        <input type="hidden"
                                name="cancionId"
                                th:value="${cancion.id}">

                        <button type="submit"
                                class="boton-favorito"
                                th:text="${favoritosIds.contains(cancion.id)} ? '♥' : '♡'"
                                th:attr="aria-label=${favoritosIds.contains(cancion.id)} ? 'Quitar de favoritos' : 'Agregar a favoritos'"
                                th:title="${favoritosIds.contains(cancion.id)} ? 'Quitar de favoritos' : 'Agregar a favoritos'">
                        </button>
                    </form>
                </article>
            </div>
        </section>


        
        <section class="reproductor">
            

            <p id="cancion-actual"></p>

            <audio id="audio" preload="metadata"></audio>

            <div class="controles-reproductor">
                <button type="button" id="anterior" aria-label="Anterior" title="Anterior">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 5h2v14H6zM19 5v14L9 12z" fill="currentColor" />
                    </svg>
                </button>
            
                <button type="button" id="reproducir" aria-label="Reproducir" title="Reproducir">
                    <svg id="icono-reproducir" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 5v14l11-7z" fill="currentColor" />
                    </svg>
                </button>
            
                <button type="button" id="siguiente" aria-label="Siguiente" title="Siguiente">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M16 5h2v14h-2zM5 5v14l10-7z" fill="currentColor" />
                    </svg>
                </button>

                <div class="control-volumen">
                    <button type="button" id="boton-volumen" aria-label="Silenciar" title="Silenciar">
                        <svg id="icono-volumen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                            <path d="M19 5a10 10 0 0 1 0 14"></path>
                        </svg>
                    </button>
                
                    <input type="range" id="barra-volumen" min="0" max="100" value="70" step="1" aria-label="Volumen">
                </div>

            </div>

            <div class="progreso-reproductor">
                <span id="tiempo-actual">0:00</span>
            
                <input type="range" id="barra-progreso" min="0" max="100" value="0" step="0.1"
                    aria-label="Posición de reproducción">
            
                <span id="duracion-total">0:00</span>
            </div>

        </section>


    </main>

    <footer class="pie">
        <p>Spotify · Proyecto de software</p>
    </footer>

    <script th:src="@{/js/reproductor.js}"></script>
</body>
</html>
