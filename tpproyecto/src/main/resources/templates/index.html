
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.12/dist/turbo.es2017-umd.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{topbar :: topbar}"></div>
    

    <main class="contenido">
        <h2>Bienvenido a Spotify</h2>
        <p>Tu espacio para escuchar y organizar música.</p>


        <p th:if="${mensaje}" th:text="${mensaje}"></p>
        
        <p th:if="${error}" 
        th:text="${error}" 
        class="mensaje-error"></p>

        <section class="seccion-musica">
            <a th:href="@{/agregar-cancion}">Agregar una canción</a>
        </section>


        <section class="seccion-musica" id="biblioteca">
            <h3>Lo más reciente</h3>
                
            <p th:if="${#lists.isEmpty(canciones)}">
                  Todavía no hay canciones cargadas.
            </p>
                
            <div class="lista-canciones" th:unless="${#lists.isEmpty(canciones)}">
                <article class="cancion" th:each="cancion : ${canciones}">
                    <div class="datos-cancion">
                        <h4 th:text="${cancion.nombre}">Nombre de la canción</h4>
                        <p th:text="${cancion.artista}">Artista</p>
                        <p th:if="${cancion.album != null and !cancion.album.isEmpty()}" th:text="${cancion.album}">Álbum</p>
                    </div>
                
                    <button type="button" class="seleccionar-cancion" th:data-nombre="${cancion.nombre}"
                         th:data-artista="${cancion.artista}" th:data-audio="${cancion.rutaArchivo}">
                         ▶ Reproducir
                    </button>
                    <div class="acciones-cancion"> 
                        <div class="agregar-a-playlist" th:if="${!#lists.isEmpty(playlists)}">
                            <button type="button" class="boton-agregar-playlist" aria-label="Agregar a una playlist"
                                title="Agregar a una playlist">
                                +
                            </button>
                        
                            <div class="opciones-playlist" hidden>
                                <form th:each="playlist : ${playlists}" th:action="@{/biblioteca/agregar-cancion}" method="post">
                        
                                    <input type="hidden" name="playlistId" th:value="${playlist.id}">
                        
                                    <input type="hidden" name="cancionId" th:value="${cancion.id}">
                        
                                    <button type="submit" th:text="${playlist.nombre}">
                                        Nombre de playlist
                                    </button>
                                </form>
                            </div>
                        </div>

                        <form th:action="@{/favoritos}" method="post">
                            <input type="hidden"
                                    name="cancionId"
                                    th:value="${cancion.id}">

                            <button type="submit"
                                    class="boton-favorito"
                                    th:text="${favoritosIds.contains(cancion.id)} ? '♥' : '♡'"
                                    th:attr="aria-label=${favoritosIds.contains(cancion.id)} ? 'Quitar de favoritos' : 'Agregar a favoritos'"
                                    th:title="${favoritosIds.contains(cancion.id)} ? 'Quitar de favoritos' : 'Agregar a favoritos'">
                            </button>
                        </form>
                    </div>
                </article>
            </div>
        </section>


        <div th:replace="~{reproductor :: reproductor}"></div>


    </main>

    <footer class="pie">
        <p>Spotify · Proyecto de software</p>
    </footer>


    <script>
        document.addEventListener("click", function (event) {
    const boton = event.target.closest(".boton-agregar-playlist");

    // 1. Si se hizo clic en el botón, abrimos o cerramos su menú correspondiente
    if (boton) {
        const menu = boton.nextElementSibling;
        if (menu) {
            menu.hidden = !menu.hidden;
        }
        event.stopPropagation();
        return; // Salimos para que no ejecute el código de abajo innecesariamente
    }

    // 2. Si se hizo clic en cualquier otra parte de la página, cerramos todos los menús de playlist de forma segura
    document.querySelectorAll(".opciones-playlist").forEach(function (menu) {
        menu.hidden = true;
    });
});
    </script>
    
</body>
</html>
