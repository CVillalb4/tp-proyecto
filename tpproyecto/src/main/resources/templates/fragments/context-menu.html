<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <div th:fragment="contextMenu" id="contextMenu" 
         style="display: none; position: fixed; background-color: #282828; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); padding: 6px 0; z-index: 999999; min-width: 200px; user-select: none;">
        
        <div id="menuAddToPlaylist" 
             style="position: relative; padding: 10px 16px; color: #fff; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between;"
             onmouseover="mostrarSubmenuPlaylists()" 
             onmouseout="ocultarSubmenuPlaylistsConDelay()">
            
            <span>Agregar a la playlist</span>
            <span style="font-size: 0.7rem; color: #B3B3B3; margin-left: 8px;">▶</span>

            <!-- Submenú -->
            <div id="playlistSubmenu" 
                 style="display: none; position: absolute; left: 100%; top: -6px; background-color: #282828; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.9); padding: 6px 0; min-width: 180px; max-height: 220px; overflow-y: auto; z-index: 1000000;"
                 onmouseover="cancelarOcultarSubmenu()" 
                 onmouseout="ocultarSubmenuPlaylistsConDelay()">
            </div>
        </div>

    </div>

</body>
</html>
